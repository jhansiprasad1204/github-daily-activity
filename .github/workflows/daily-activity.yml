name: Daily Repository Maintenance

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC (Daily Inventory Report)
    - cron: "30 1 * * *"
    # 7:10 AM IST = 1:40 AM UTC (Daily Quality Report)
    - cron: "40 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Select maintenance task"
        required: true
        type: choice
        options:
          - all
          - inventory
          - quality
        default: all

permissions:
  contents: write

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Select maintenance task
        id: task
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mode=$MANUAL_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "30 1 * * *" ]; then
            echo "mode=inventory" >> "$GITHUB_OUTPUT"
          else
            echo "mode=quality" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate maintenance report
        run: |
          python scripts/daily_update.py "${{ steps.task.outputs.mode }}"

      - name: Configure Git identity
        env:
          COMMIT_NAME: ${{ secrets.COMMIT_NAME || 'jhansiprasad1204' }}
          COMMIT_EMAIL: ${{ secrets.COMMIT_EMAIL || 'jhansiprasad1204@gmail.com' }}
        run: |
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"

      - name: Commit and push report if changed
        run: |
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: update daily maintenance reports [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
